<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limbus Coin Flipper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Limbus Coin Flipper</h1>
    <p class="tagline">Every coin lands on its max (heads) or its min (tails), 50/50. Clash power is added to each coin.</p>
  </header>

  <main>

    <div class="sides">

      <!-- ========== SIDE A ========== -->
      <section class="panel panel-a" aria-labelledby="title-a">
        <h2 id="title-a">Player</h2>

        <div class="field-grid">
          <div class="field">
            <label for="count-a">Number of Coins</label>
            <input type="number" id="count-a" min="1" max="10" step="1" value="3">
          </div>
          <div class="field">
            <label for="clash-a">Clash Power</label>
            <input type="number" id="clash-a" step="1" value="0">
          </div>
        </div>

        <div class="coin-config">
          <div class="coin-config-head">
            <span>Coin</span><span>Min</span><span>Max</span>
          </div>
          <div id="coins-a" class="coin-rows"></div>
        </div>

        <div class="result-box">
          <div id="result-a" class="coin-results" aria-live="polite"></div>
          <div class="total-line">Total <strong id="total-a">&mdash;</strong></div>
        </div>
      </section>

      <!-- ========== SIDE B ========== -->
      <section class="panel panel-b" aria-labelledby="title-b">
        <h2 id="title-b">Adversary</h2>

        <div class="field-grid">
          <div class="field">
            <label for="count-b">Number of Coins</label>
            <input type="number" id="count-b" min="1" max="10" step="1" value="3">
          </div>
          <div class="field">
            <label for="clash-b">Clash Power</label>
            <input type="number" id="clash-b" step="1" value="0">
          </div>
        </div>

        <div class="coin-config">
          <div class="coin-config-head">
            <span>Coin</span><span>Min</span><span>Max</span>
          </div>
          <div id="coins-b" class="coin-rows"></div>
        </div>

        <div class="result-box">
          <div id="result-b" class="coin-results" aria-live="polite"></div>
          <div class="total-line">Total <strong id="total-b">&mdash;</strong></div>
        </div>
      </section>

    </div>

    <div class="action-row">
      <button type="button" id="flipBtn" class="flip-btn">Flip Coins</button>
    </div>

    <div id="verdict" class="verdict" role="status" aria-live="polite">Press Flip Coins to start.</div>

    <section class="history" aria-labelledby="history-title">
      <div class="history-head">
        <h2 id="history-title">History</h2>
        <button type="button" id="clearHistory" class="ghost-btn">Clear</button>
      </div>
      <ol id="historyList" class="history-list"></ol>
      <p id="historyEmpty" class="history-empty">No clashes yet.</p>
    </section>

  </main>

  <footer class="site-footer">
    <p>Fan-made tool. Not affiliated with Project Moon.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
